# Guild Squads package dry run: builds the zip on every pull request and keeps it as an artifact.
# "-d" = skip upload. No secrets, nothing is published.
# Run it by hand on a tag (Actions > Package dry run > Run workflow > pick the tag) to get a cleanly
# versioned zip without publishing anything (docs/en/RELEASE.md).
name: Package dry run
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Package without uploading (BigWigs packager v2.6.1, pinned by SHA)
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d
      - uses: actions/upload-artifact@v7
        with:
          name: GuildSquads-zip
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true
